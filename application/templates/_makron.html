{% macro dagkort(dag, rubrik) %}
{% set text, ikon = dag.kod | vaderkod %}
<article class="col py-4 border-top">
    <div class="d-flex justify-content-between align-items-baseline">
        <h3 class="h4 m-0">{{ rubrik }}</h3>
        <span class="small" style="color: var(--vader-dampad)">{{ dag.datum | veckodag }}</span>
    </div>
    <p class="my-3"><i class="bi bi-{{ ikon }} fs-3 me-2" aria-hidden="true"></i>{{ text }}</p>
    <p class="m-0">
        Högst <span style="color: var(--vader-max)">{{ dag.max | temperatur }}</span>
        Lägst <span style="color: var(--vader-min)">{{ dag.min | temperatur }}</span>
    </p>
    <p class="small m-0" style="color: var(--vader-dampad)">Nederbörd {{ dag.nederbord | nederbord }}</p>
</article>
{% endmacro %}
